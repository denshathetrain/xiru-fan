<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시루냥 팬사이트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <a class="logo" href="/">시루냥 <span>팬사이트</span></a>
        <nav class="nav">
            <a href="/">메인</a>
            <a href="/post/">게시판</a>
            <a href="/schedule/">캘린더</a>
            
            <a href="/upbo/">업보목록</a>
            <a href="/tetris/">테트리스</a>
            <a href="/song/">노래책</a>
        </nav>
    </div>
</header>

<main class="home-main">
    <section class="hero home-hero">
        <div class="hero-glow"></div>
        <div class="hero-profile">
            <div class="profile-image">
                <img src="https://stimg.sooplive.com/LOGO/xi/xirus2/m/xirus2.webp" alt="시루냥">
            </div>
        </div>
        <div class="hero-copy">
            <div class="eyebrow">XIRUNYANG FAN SITE</div>
            <h1>시루냥</h1>
            <p>비공식 팬사이트</p>
        </div>
    </section>

    <section class="home-grid">
        <article class="home-card live-card">
            <div class="home-card-head">
                <div><span class="card-label">LIVE</span><h2>방송</h2></div>
                <span class="live-dot"></span>
            </div>
            <div class="live-preview" id="live-preview">
                <div class="live-placeholder">방송 상태를 확인하는 중...</div>
            </div>
            <p id="live-status-text">확인 중...</p>

        </article>

        <article class="home-card notice-card">
            <div class="home-card-head">
                <div><span class="card-label">NOTICE</span><h2>공지</h2></div>
                <a href="/post" class="card-arrow">→</a>
            </div>
            <div class="notice-list">
                <div class="notice-item"><span>NOTICE</span><b>공지</b></div>

        </article>
    </section>
</main>

<footer class="footer">시루냥 팬사이트 · 준비중</footer>
<script src="script.js"></script>
</body>
</html>

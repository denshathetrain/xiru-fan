<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캘린더 | 시루냥 팬사이트</title><link rel="stylesheet" href="../style.css"></head><body>
<header class="site-header"><div class="header-inner"><a class="logo" href="../">시루냥 <span>팬사이트</span></a><nav class="nav"><a href="../">메인</a><a href="../post/">포스트</a><a href="./">캘린더</a><a href="../tetris/">테트리스</a></nav></div></header>
<main><div class="schedule-wrap"><div class="schedule-toolbar"><button class="month-btn" id="prev">‹</button><h1 id="title">2026년 8월</h1><button class="month-btn" id="next">›</button></div>
<div class="calendar-scroll"><div class="calendar"><div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div id="body"></div></div></div>
<div class="calendar-note">일단 8월만</div></div></main>
<footer class="footer">시루냥 팬사이트 · 준비중</footer>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyQFVjE0ZhUW4w59tiPUYssaFJ8R92iKpEYtYVZbp6bp61x7hrW13XGLh0ZOOED1v9s/exec";

let data = {};

function loadSchedule() {
    const callbackName = "scheduleCallback";

    window[callbackName] = function(schedules) {
        console.log("받은 일정:", schedules);

        data = {};

        schedules.forEach(item => {
            const date = new Date(item.date);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            const key = `${year}-${month}-${day}`;
            if (!data[key]) {
                data[key] = [];
            }

            data[key].push([
                item.content,
                item.color
            ]);
        });

        render(cur.getFullYear(), cur.getMonth());
    };

    const script = document.createElement("script");

    script.src =
        API_URL +
        "?callback=" +
        callbackName +
        "&t=" +
        Date.now();

    script.onerror = function() {
        console.error("일정 데이터를 불러오지 못했습니다.");
    };

    document.body.appendChild(script);
}

function render(y, m) {
    title.textContent = `${y}년 ${m + 1}월`;
    body.innerHTML = "";

    const first = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();

    let d = 1;

    for (let r = 0; r < 6 && d <= days; r++) {
        const w = document.createElement("div");
        w.className = "week";

        for (let c = 0; c < 7; c++) {
            const cell = document.createElement("div");
            cell.className = "day";

            const i = r * 7 + c;

            if (i < first || d > days) {
                w.appendChild(cell);
                continue;
            }

            if (c === 0) cell.classList.add("sunday");
            if (c === 6) cell.classList.add("saturday");

            const n = document.createElement("div");
            n.className = "day-num";
            n.textContent = d;

            cell.appendChild(n);

            const month = String(m + 1).padStart(2, "0");
            const day = String(d).padStart(2, "0");

            const key = `${y}-${month}-${day}`;

            (data[key] || []).forEach(e => {
                const x = document.createElement("div");

                x.className = `event ${e[1]}`;
                x.textContent = e[0];

                cell.appendChild(x);
            });

            w.appendChild(cell);
            d++;
        }

        body.appendChild(w);
    }
}

let cur = new Date(2026, 7, 1);

prev.onclick = () => {
    cur.setMonth(cur.getMonth() - 1);
    render(cur.getFullYear(), cur.getMonth());
};

next.onclick = () => {
    cur.setMonth(cur.getMonth() + 1);
    render(cur.getFullYear(), cur.getMonth());
};

render(cur.getFullYear(), cur.getMonth());
loadSchedule();
</script>
</body>
</html>

function render(y,m){title.textContent=`${y}년 ${m+1}월`;body.innerHTML="";let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),d=1;
for(let r=0;r<6&&d<=days;r++){let w=document.createElement("div");w.className="week";for(let c=0;c<7;c++){let cell=document.createElement("div");cell.className="day";let i=r*7+c;if(i<first||d>days){w.appendChild(cell);continue}if(c===0)cell.classList.add("sunday");if(c===6)cell.classList.add("saturday");let n=document.createElement("div");n.className="day-num";n.textContent=d;cell.appendChild(n);(data[d]||[]).forEach(e=>{let x=document.createElement("div");x.className="event "+e[1];x.textContent=e[0];cell.appendChild(x)});w.appendChild(cell);d++}body.appendChild(w)}}
let cur=new Date(2026,7,1);render(cur.getFullYear(),cur.getMonth());
prev.onclick=()=>{cur.setMonth(cur.getMonth()-1);render(cur.getFullYear(),cur.getMonth())};next.onclick=()=>{cur.setMonth(cur.getMonth()+1);render(cur.getFullYear(),cur.getMonth())};
</script></body></html>
